# LLM council configuration. Model and flags are recorded in every cycle manifest.
version: 1
model: deepseek-v4.1-flash:cloud      # v4-flash (0731) was retired by Ollama Cloud on 2026-09-25
host: http://localhost:11434
think: false
temperature: 0
num_ctx: 32768
seeds: {bull: 42, bear: 43, pm: [42, 43, 44]}
timeouts_s: [40, 60, 90]
limiter: {calls_per_min: 20, concurrency: 3}
max_calls_per_cycle: 16
drop_order_when_over_budget: [single_agent_control, macro, news]
format: json                   # Ollama Cloud ignores JSON schemas: JSON mode + strict validation after decode
roles:
  news:     {enabled: true,  replicates: 1, cadence: every_cycle, max_num_predict: 1200}
  macro:    {enabled: true,  replicates: 1, cadence: first_cycle_of_utc_day, max_num_predict: 700}
  bull:     {enabled: true,  replicates: 1, max_num_predict: 2000}
  bear:     {enabled: true,  replicates: 1, max_num_predict: 2000}
  pm:       {enabled: true,  replicates: 3, max_num_predict: 1200}
  single_agent_control: {enabled: true, replicates: 3, max_num_predict: 1200}   # opted in (control C10)
  # v1.1 (with single stocks): filings, sector
outage_guard: {stage_retry_wait_s: 120, stage_retries: 3}
slots_utc_hours: [2, 6, 10, 14, 18, 22]
slot_minute: 40
late_max_min: 120
cycle_budget_min: 25
