# Mechanical reference book: default position, the council's band centre, the fallback, and the
# primary benchmark. Aggression comes from COMPOSITION (equity- and crypto-heavy, no bonds) at about
# 1x gross, not from leverage. Vol is used as a CAP (shrink lines in vol spikes), never to lever up.
version: 2
vol:
  ewma_lambda: 0.94
  realised_window: 60
  realised_floor_mult: 0.8          # sigma = max(ewma, 0.8 * realised_60d), annualised
  annualisation_days: {crypto: 365, default: 252}
  line_cap_ratio: 1.0               # unit = base_weight * min(1, sigma_1y_median / sigma_now)
trend:
  fast_sma: 50
  slow_sma: 200                     # PRIOR completed daily closes only
  band_pct: 2.0                     # hysteresis around each SMA (variant V3, selected by the frozen rule)
  confirm_closes: 1
  levels: {up: 1.0, mixed: 0.75, down: 0.25}
  crypto_confirm_closes: 2          # crypto trend flips need 2 consecutive closes (1%/side costs)
level_grid: [-0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
book:
  ex_ante_vol_target: 0.22          # informational target for the all-uptrend book (published)
  ex_ante_vol_hard: 0.30            # above this the whole book is scaled down
  covariance_ewma_days: 90
  never_short: true
  never_lever: true
