# Builds the static site from journal/, prompts/ and policy/ and deploys it to GitHub Pages.
# No generated HTML is ever committed. Every `uses:` is pinned to a full commit SHA with its release
# in a comment; Dependabot (.github/dependabot.yml) proposes the bumps weekly.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "journal/**"
      - "site/**"
      - "prompts/**"
      - "policy/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Build (fails on any leak-scan finding)
        run: uv run python site/build.py --out _site
      - name: Leak scan of the built site
        run: uv run python -m council.publish.leakscan _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
