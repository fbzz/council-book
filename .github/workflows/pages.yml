# Builds the static site from journal/, prompts/ and policy/ and deploys it to GitHub Pages.
# No generated HTML is ever committed. Every `uses:` is pinned to a full commit SHA with its release
# in a comment; Dependabot (.github/dependabot.yml) proposes the bumps weekly.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "journal/**"
      - "site/**"
      - "prompts/**"
      - "policy/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Build (fails on any leak-scan finding)
        run: uv run python site/build.py --out _site
      - name: Leak scan of the built site
        run: uv run python -m council.publish.leakscan _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
