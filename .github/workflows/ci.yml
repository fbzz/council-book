# Tests, lint, the public-record leak scan, gitleaks and the noreply-identity check.
# Every `uses:` is pinned to a full commit SHA with its release in a comment; Dependabot
# (.github/dependabot.yml) proposes the bumps weekly. tests/boundaries/test_ci_config.py fails on an
# unpinned action.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (no network, no LLM, no broker)
        run: uv run pytest -m "not live"
      - name: Leak scan of everything public
        run: uv run python -m council.publish.leakscan journal docs site README.md DISCLAIMER.md SECURITY.md CHANGELOG.md
      - name: Site builds and passes the leak scan
        run: uv run python site/build.py --out _site

  m5-acceptance:
    # The named acceptance tests of every landed M5 / transparency package (m5-readiness §6 R6):
    # the node ids come from council.operator.readiness.ACCEPTANCE. `council doctor --ready
    # --network` reads this job's result on the release commit (R3, R6, P1, LC2, LC3); a package
    # whose tests do not exist yet is reported by R6 as "not built", not failed here.
    name: m5-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Named acceptance tests (no network, no LLM, no broker)
        run: |
          set -euo pipefail
          mapfile -t ids < <(uv run python -m council.operator.readiness acceptance-ids)
          test "${#ids[@]}" -gt 0
          printf '%s\n' "${ids[@]}"
          uv run pytest -m "not live" "${ids[@]}"

  rehearsal:
    # The onboarding rehearsal (m5-readiness §7.2 L1 + variants, M5-G) and the L2 dress-rehearsal
    # script run with fakes: FakeEtoro on 127.0.0.1 only, the stub model, a local bare remote, no
    # keychain (the opt-in -m macos_keychain test never runs here). Under 120 s.
    name: rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Shellcheck the dress-rehearsal script
        run: shellcheck ops/rehearse-onboarding.sh
      - name: Rehearsal (no network, no LLM, no broker)
        run: uv run pytest -m "not live" tests/rehearsal

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        # the binary directly: gitleaks-action cannot diff a repository's first push. The tarball
        # is checked against the sha256 published in the release's gitleaks_<ver>_checksums.txt
        # before it is unpacked; bump the version and the digest together.
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -eu
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  /tmp/$tarball" | sha256sum -c -
          tar xzf "/tmp/$tarball" -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 --config .gitleaks.toml .

  identity:
    name: noreply identities and journal ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every author and committer e-mail is a GitHub noreply address
        # Authors must be @users.noreply.github.com addresses. A committer may also be GitHub's
        # own web-flow identity (exactly noreply@github.com), which commits Dependabot's branches
        # and web-UI merges; fetch-depth 0 brings those branches into `git log --all`.
        run: |
          bad=$( { git log --all --format='%ae'
                   git log --all --format='%ce' | grep -v -x -F 'noreply@github.com' || true; } \
                 | sort -u | grep -v -E '@users\.noreply\.github\.com$' || true)
          if [ -n "$bad" ]; then
            echo "::error::$(printf '%s\n' "$bad" | wc -l | tr -d ' ') commit identity(ies) are not noreply addresses"
            exit 1
          fi
          echo "all commit identities are noreply"
      - name: Publisher commits touch only journal/; humans only add incidents or withdrawn claims there
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          base="${BASE_SHA:-${BEFORE:-}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="HEAD"
          else
            range="$base..HEAD"
          fi
          status=0
          for c in $(git rev-list --no-merges "$range"); do
            name=$(git log -1 --format='%an' "$c")
            files=$(git diff-tree --no-commit-id --name-only -r "$c")
            if [ "$name" = "council-publisher" ]; then
              outside=$(printf '%s\n' "$files" | grep -v -E '^journal/' || true)
              if [ -n "$outside" ]; then
                echo "::error::publisher commit $c touches paths outside journal/"; status=1
              fi
            else
              inside=$(printf '%s\n' "$files" | grep -E '^journal/' \
                | grep -v -E '^journal/(incidents/INC-[0-9]{4}\.md|claims/withdrawn\.md|\.keep)$' || true)
              if [ -n "$inside" ]; then
                echo "::error::human commit $c edits journal/ (only new incidents or withdrawn claims are allowed)"; status=1
              fi
            fi
          done
          exit $status
